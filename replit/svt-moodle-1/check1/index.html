<!DOCTYPE html>
<html>

<head>
  <title>1140095</title>
  <meta charset="utf-8">
</head>

<body>

  <h4>1140095</h4>
  <input type="number" value="1" id="n1">
  <input type="number" value="1" id="n2">
  <input type="number" value="1" id="n3">
  <input type="number" value="1" id="n4">
  <input type="number" value="1" id="n5">
  <input type="number" value="1" id="n6">
  <input type="number" value="" id="result1">
  <input type="number" value="" id="result2">
  <button id="bt" onclick="
      // строка ниже сработает если в title вы напишете свой логин
      document.querySelector('h4').textContent = document.title;
     
      // извлечение данных
      const n1 = Number(document.querySelector('#n1').value);
      const n2 = Number(document.querySelector('#n2').value); 
      const n3 = Number(document.querySelector('#n3').value);
      const n4 = Number(document.querySelector('#n4').value); 
      const n5 = Number(document.querySelector('#n5').value);
      const n6 = Number(document.querySelector('#n6').value); 
      
      // вычисления
      const denominator = n1 * n5 - n2 * n4;
      const x = (n3 * n5 - n2 * n6) / denominator;
      const y = (n1 * n6 - n3 * n4) / denominator;
       
      // запись результата 
      document.querySelector('#result1').value = x;
      document.querySelector('#result2').value = y;                                                          
    ">Выполнить задание</button>

</body>

</html>
