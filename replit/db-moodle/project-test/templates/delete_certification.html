<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Certification</title>
    <meta http-equiv="cache-control" content="no-cache">
</head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Delete Certification</title>
    </head>
    <body>
        <h1>Delete Certification</h1>
        <form id="deleteForm">
            <label for="certificationId">Certification ID:</label><br>
            <input type="number" id="certificationId" name="certification_id" required><br>
            <button type="button" onclick="deleteCertification()">Delete Certification</button>
        </form>

        <script>
            function deleteCertification() {
                const certificationId = document.getElementById('certificationId').value;

                fetch(`/delete_certification/${certificationId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    document.getElementById('deleteForm').reset();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting certification');
                });
            }
        </script>
    </body>
    </html>
