<!-- edit_certification.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактировать аттестацию</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9; 
        }
        h1 {
            text-align: center;
            margin: 20px 0;
            color: #333; 
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 300px;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); 
        }
        label {
            margin-bottom: 5px;
            color: #555; 
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd; 
            border-radius: 4px; 
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            border: 1px solid #007bff; 
            background-color: #007bff; 
            color: #fff; 
            cursor: pointer;
            align-self: center;
        }
        input[type="submit"]:hover {
            background-color: #0056b3; 
        }
        footer {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #777; 
            background-color: #f2f2f2; 
            margin-top: auto; 
        }
    </style>
</head>
<body>
    <h1>Редактировать аттестацию</h1>
    <form action="{{ url_for('update_certification', certification_id=certification.id) }}" method="post">
        
        <label for="employee_id">ID сотрудника:</label>
        <input type="text" id="employee_id" name="employee_id" value="{{ certification.employee_id }}" required>
        
        <label for="type">Тип аттестации:</label>
        <input type="text" id="type" name="type" value="{{ certification.type }}" required>
        
        <label for="status">Статус:</label>
        <input type="checkbox" id="status" name="status" {% if certification.status %}checked{% endif %}>

        <label for="no_attestation_reason">Причина отсутствия аттестации:</label>
        <input type="text" id="no_attestation_reason" name="no_attestation_reason" value="{{ certification.no_attestation_reason }}">
        
        <label for="date">Дата:</label>
        <input type="date" id="date" name="date" value="{{ certification.date }}"><br>
        
        <input type="submit" value="Сохранить изменения">
    </form>
    <footer>
        Разработано командой Vедышки<br>
        Санкт-Петербург<br>
        2024
    </footer>
</body>
</html>
